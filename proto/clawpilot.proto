syntax = "proto3";

package clawpilot;

// =============================================================================
// OpenClaw 核心配置
// =============================================================================

// OpenClaw 主配置文件
message OpenClawConfig {
  string current_opc = 1;           // 当前激活的团队名称
  string version = 2;               // OpenClaw 版本
  int64 last_updated = 3;           // 最后更新时间戳
}

// OPC (OpenClaw 团队) 完整配置
message OPCConfig {
  string id = 1;                   // OPC 唯一标识
  string name = 2;                  // 团队名称（目录名）
  string display_name = 3;          // 显示名称
  string description = 4;           // 描述
  string avatar_color = 5;         // 头像颜色（用于UI）
  string avatar_initials = 6;      // 头像文字
  bool is_active = 7;               // 是否激活（当前选中）
  bool is_running = 8;             // 是否运行中
  int64 created_at = 9;             // 创建时间
  int64 updated_at = 10;            // 更新时间

  // 统计数据（从 OpenClaw 日志计算）
  OPCStats stats = 11;              // 统计信息

  // 关联的办公室
  string office_id = 12;            // 关联的办公室 ID
  string office_name = 13;          // 关联的办公室名称

  repeated AgentConfig agents = 20; // Agent 列表
  ModelsConfig models = 21;         // 模型配置
  ChannelsConfig channels = 22;     // 渠道配置
  BindingsConfig bindings = 23;     // 绑定配置
}

// OPC 统计数据
message OPCStats {
  int32 agent_count = 1;           // Agent 数量
  int32 channel_count = 2;         // 频道数量
  int32 group_count = 3;           // 群聊数量
  int32 dm_count = 4;              // 私聊数量
  int64 message_count_today = 5;   // 今日消息数
  double message_growth = 6;       // 消息增长率（百分比）
}

// =============================================================================
// 办公室（物理部署环境）
// =============================================================================

// 远程门禁认证方式
enum AccessAuthType {
  ACCESS_AUTH_UNSPECIFIED = 0;
  ACCESS_AUTH_PASSWORD = 1;   // 用户名 + 密码
  ACCESS_AUTH_SSH_KEY = 2;    // 用户名 + SSH 私钥
}

// 办公室（一台可部署 OpenClaw 的主机）
message Office {
  string id = 1;
  string name = 2;
  string address = 3;                // IP 或域名，"localhost" 表示本机

  // 远程门禁凭证（仅 address != localhost 时有效）
  AccessAuthType access_auth_type = 10; // 认证方式
  string access_user = 11;           // 用户名
  string access_password = 12;       // 密码（access_auth_type = PASSWORD 时）
  string ssh_key_path = 13;          // SSH 私钥路径（access_auth_type = SSH_KEY 时）

  string phone = 20;
  string receptionist_image = 21;
  string ownership = 22;             // RENTED | OWNED
  double monthly_rent = 23;
  string internet_speed = 24;
  string decoration_grade = 25;      // HIGH | MEDIUM | LOW
  string description = 26;

  string daemon_url = 30;            // Daemon HTTP endpoint
  reserved 31;                       // was daemon_api_key (removed: daemon no longer requires auth)

  string opc_root = 32;               // 可配置的部署目录
  string initial_openclaw_config = 33; // 初始 openclaw.json 配置（JSON 字符串）

  // OpenClaw 安装信息（安装成功后写入）
  string openclaw_version = 34;        // OpenClaw 安装版本
  string openclaw_install_path = 35;   // OpenClaw 安装路径（which openclaw）
  string openclaw_download_url = 36;   // OpenClaw 离线包下载地址
  string openclaw_nodejs_path = 37;    // OpenClaw 使用的 Node.js 路径
  string openclaw_nodejs_version = 38; // Node.js 版本号
  int64  openclaw_installed_at = 39;   // 安装时间戳（Unix 秒）

  string current_opc_id = 40;
  string current_opc_name = 41;

  int64 created_at = 50;
  int64 updated_at = 51;
}

// =============================================================================
// 工具和技能（本地文件目录）
// =============================================================================

// 工具信息（本地工具目录）
// 工具以目录形式存储在 workspace/tools/{tool_id}/ 下
message ToolInfo {
  string id = 1;                    // 工具 ID（目录名，如 "openai-whisper-api"）
  string name = 2;                  // 工具名称
  string description = 3;          // 工具描述
  string version = 4;               // 版本号
  bool is_local = 5;                // 是否为本地工具（非 ClawHub）
  int64 installed_at = 6;           // 安装时间
}

// 技能信息（本地技能目录）
// 技能以目录形式存储在 workspace/skills/{skill_slug}/ 下
// 每个技能目录包含：SKILL.md, index.js, package.json 等
message SkillInfo {
  string id = 1;                    // 技能 ID
  string slug = 2;                  // 技能 slug（目录名，如 "feishu-doc"）
  string name = 3;                  // 技能名称
  string description = 4;          // 技能描述
  string version = 5;               // 版本号
  string author = 6;                // 作者
  bool is_local = 7;                // 是否为本地技能（非 ClawHub）
  int64 installed_at = 8;           // 安装时间

  // 技能文件清单（部署时需要打包）
  repeated string files = 9;        // 文件列表（如 ["SKILL.md", "index.js"]）
}

// 技能元数据（从 ClawHub 同步，用于展示和安装）
message SkillMetadata {
  string slug = 1;                  // 技能 slug
  string name = 2;                  // 技能名称
  string description = 3;          // 技能描述
  string author = 4;                // 作者
  string version = 5;               // 最新版本
  string url = 6;                   // ClawHub URL
  repeated string tags = 7;         // 标签
  string category = 8;              // 分类
}

// =============================================================================
// Agent 配置
// =============================================================================

// Agent 配置
message AgentConfig {
  string id = 1;                    // Agent 唯一标识
  string name = 2;                  // Agent 名称
  string display_name = 3;          // 显示名称（中文名）
  string job_title = 4;             // 职位/职称
  string personality = 5;           // 性格特征
  string description = 6;          // 简介描述
  string initials = 7;             // 英文标识（用于显示）
  string gradient_start = 8;       // 渐变色起始（用于UI）
  string gradient_end = 9;         // 渐变色结束（用于UI）
  bool is_default = 10;            // 是否为默认响应者（列表第一个）
  int32 order_index = 11;          // 排序索引（拖拽排序）

  // Agent 文档内容
  AgentDocuments documents = 20;

  // 工具配置
  repeated string enabled_tools = 21;    // 启用的工具 ID 列表（引用全局工具库）
  repeated string disabled_tools = 22;   // 禁用的工具 ID（用于全局排除特定工具）

  // 护栏规则
  repeated string guardrail_allow = 23;  // 允许自主执行的操作
  repeated string guardrail_deny = 24;   // 禁止或须请示的操作

  // 模型配置（格式：provider/model_id）
  string model = 25;                // 模型标识

  // 技能配置
  repeated string enabled_skills = 26; // 启用的技能 slug 列表（引用本地 skills/ 目录）

  // 汇报关系
  repeated string reports_to = 27;  // 汇报给哪些 Agent
  repeated string manages = 28;     // 管理哪些 Agent

  // 元数据
  int64 created_at = 50;
  int64 updated_at = 51;
}

// Agent 文档内容
message AgentDocuments {
  string soul = 1;          // SOUL.md - 核心灵魂定义
  string identity = 2;      // IDENTITY.md - 身份定义
  string agents = 3;        // AGENTS.md - 团队关系
  string user = 4;          // USER.md - 用户画像
  string memory = 5;        // MEMORY.md - 记忆配置
  string heartbeat = 6;     // HEARTBEAT.md - 心跳定义
  string tools = 7;         // TOOLS.md - 工具文档
}

// =============================================================================
// Provider 和模型配置
// =============================================================================

// Provider API 类型
enum ProviderApiType {
  API_UNKNOWN = 0;
  API_OPENAI_COMPLETIONS = 1;   // OpenAI 兼容 API
  API_ANTHROPIC_MESSAGES = 2;   // Anthropic Messages API
  API_GEMINI = 3;               // Google Gemini API
}

// Provider 配置
message ProviderConfig {
  string id = 1;                    // Provider ID (UUID)
  string name = 2;                  // Provider 名称（如 bailian, openai, anthropic）
  string api = 3;                   // API 类型（openai-completions, anthropic-messages, gemini）
  string base_url = 4;              // API 基础 URL
  string api_key = 5;               // API Key (加密存储)
  bool is_enabled = 6;              // 是否启用
  bool is_available = 7;            // 是否可用（上次测试结果）
  int64 last_tested = 8;            // 最后测试时间
  int64 created_at = 9;             // 创建时间
  int64 updated_at = 10;            // 更新时间
}

// 模型信息
message ModelInfo {
  string id = 1;                    // 模型 ID (UUID)
  string provider_name = 2;         // 所属提供商名称
  string model_id = 3;              // 模型标识（如 gpt-4o, claude-3-opus）
  string display_name = 4;          // 显示名称
  int32 context_window = 5;         // 上下文窗口大小
  int32 max_tokens = 6;             // 最大输出 tokens
  string input_types = 7;           // 支持的输入类型（JSON 数组字符串）
  double cost_input = 8;            // 输入价格
  double cost_output = 9;           // 输出价格
  bool supports_vision = 10;        // 是否支持视觉
  bool supports_function_calling = 11; // 是否支持函数调用
  bool supports_streaming = 12;     // 是否支持流式输出
  bool is_custom = 13;              // 是否为自定义模型
  int32 sort_order = 14;            // 排序顺序
  int64 updated_at = 15;            // 更新时间
}

// 模型配置
message ModelsConfig {
  string default_provider = 1;     // 默认 Provider 名称
  repeated ProviderConfig providers = 2; // Provider 列表
  repeated ModelInfo models = 3;   // 可用模型列表
}

// =============================================================================
// 渠道配置
// =============================================================================

// 渠道类型
enum ChannelType {
  CHANNEL_UNKNOWN = 0;
  CHANNEL_FEISHU = 1;       // 飞书
  CHANNEL_DINGTALK = 2;     // 钉钉
  CHANNEL_SLACK = 3;        // Slack
  CHANNEL_WECHAT = 4;       // 微信 (预留)
}

// 飞书配置
message FeishuConfig {
  string app_id = 1;              // 应用 ID
  string app_secret = 2;          // 应用密钥 (加密)
}

// 钉钉配置
message DingtalkConfig {
  string app_key = 1;             // 应用 Key
  string app_secret = 2;          // 应用密钥 (加密)
}

// Slack 配置
message SlackConfig {
  string bot_token = 1;           // Bot Token
  string app_id = 2;              // 应用 ID
  string signing_secret = 3;      // 签名密钥
}

// 渠道配置
message ChannelConfig {
  ChannelType type = 1;          // 渠道类型
  bool is_enabled = 2;           // 是否启用
  oneof config {
    FeishuConfig feishu = 10;    // 飞书配置
    DingtalkConfig dingtalk = 11; // 钉钉配置
    SlackConfig slack = 12;      // Slack 配置
  }
}

// 渠道配置集合
message ChannelsConfig {
  repeated ChannelConfig channels = 1;
}

// =============================================================================
// 绑定配置
// =============================================================================

// 频道类型
enum FeishuChannelType {
  CHANNEL_GROUP = 0;               // 群聊
  CHANNEL_DM = 1;                  // 私聊
}

// 触发模式（飞书本身的功能）
enum TriggerMode {
  TRIGGER_MENTION = 0;      // @机器人触发
  TRIGGER_ALL = 1;          // 所有消息
}

// 绑定规则
message BindingRule {
  string id = 1;                    // 绑定 ID
  string channel_id = 2;            // 频道 ID (群ID/用户ID)
  string channel_name = 3;          // 频道名称
  FeishuChannelType channel_type = 4; // 频道类型（群聊/私聊）
  string agent_id = 5;              // 绑定的 Agent ID
  string agent_name = 6;            // Agent 名称（冗余）
  TriggerMode trigger_mode = 7;     // 触发模式（@机器人/所有消息）
  bool is_enabled = 8;              // 是否启用
  int64 created_at = 9;
  int64 updated_at = 10;
}

// 绑定配置
message BindingsConfig {
  repeated BindingRule bindings = 1;
  string default_agent = 2;         // 默认 Agent（可选，用于兜底）
}

// =============================================================================
// 本地快照
// =============================================================================

// 本地快照（免费功能）
message LocalSnapshot {
  string id = 1;                    // 快照 ID
  string label = 2;                 // 快照标签
  string opc_name = 3;              // OPC 名称
  bytes config_data = 4;            // 配置数据 (JSON 序列化)
  int64 created_at = 5;             // 创建时间
  bool is_auto = 6;                 // 是否自动生成 (部署前自动备份)
}

// =============================================================================
// 日志和监控
// =============================================================================

// 日志级别
enum LogLevel {
  LOG_DEBUG = 0;
  LOG_INFO = 1;
  LOG_WARN = 2;
  LOG_ERROR = 3;
}

// 日志条目
message LogEntry {
  int64 timestamp = 1;               // 时间戳
  LogLevel level = 2;               // 日志级别
  string component = 3;              // 组件/模块
  string message = 4;               // 消息
  string agent_id = 5;              // 相关 Agent ID (可选)
  string channel = 6;               // 相关渠道 (可选)
  map<string, string> metadata = 7; // 元数据
}

// =============================================================================
// 部署相关
// =============================================================================

// 部署任务
message DeploymentTask {
  string id = 1;                    // 任务 ID
  string opc_name = 2;              // OPC 名称
  DeploymentStatus status = 3;      // 状态
  string message = 4;               // 状态消息

  // 步骤进度
  repeated DeploymentStep steps = 10; // 执行步骤
  int32 current_step = 11;          // 当前步骤索引

  int64 created_at = 20;
  int64 started_at = 21;
  int64 completed_at = 22;
}

// 部署状态
enum DeploymentStatus {
  DEPLOYMENT_PENDING = 0;
  DEPLOYMENT_RUNNING = 1;
  DEPLOYMENT_SUCCESS = 2;
  DEPLOYMENT_FAILED = 3;
  DEPLOYMENT_ROLLBACK = 4;      // 回滚中
}

// 部署步骤
message DeploymentStep {
  string name = 1;                    // 步骤名称
  string description = 2;             // 描述
  StepStatus status = 3;              // 状态
  string output = 4;                  // 输出信息
  int64 started_at = 5;
  int64 completed_at = 6;
}

// 步骤状态
enum StepStatus {
  STEP_PENDING = 0;
  STEP_RUNNING = 1;
  STEP_SUCCESS = 2;
  STEP_FAILED = 3;
  STEP_SKIPPED = 4;
}