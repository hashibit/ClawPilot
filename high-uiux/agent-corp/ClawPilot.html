<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>ClawPilot — AI 团队配置管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style id="theme-overrides">
/* Each theme overrides only the warm-colored tokens. Surfaces stay deep-green. */

/* Amber (default / current) — keeps tokens.css as-is */

/* Mint Wave — 赛博薄荷, 我们的推荐 */
html[data-theme="mint"] {
  --accent: #5eead4;
  --accent-hover: #7af0dd;
  --accent-soft: #5eead418;
  --accent-border: #5eead440;
  --accent-glow: #5eead428;
  --border-focus: #5eead4;

  --mint: #f5b041;     /* swap secondary to warm so we still have a contrast pair */
  --mint-soft: #f5b04115;
  --mint-border: #f5b04135;

  --warning: #f5b041;
  --warning-soft: #f5b04118;
  --danger: #ef6f6c;
  --danger-soft: #ef6f6c18;
  --info: #7dd3fc;
  --info-soft: #7dd3fc18;

  --text-on-accent: #04201b;

  --agent-1: #5eead4;
  --agent-2: #fcd34d;
  --agent-3: #c4b5fd;
  --agent-4: #f472b6;
  --agent-5: #86efac;
  --agent-6: #7dd3fc;
  --agent-7: #fda4af;
  --agent-8: #a8e6cf;
}

/* Volt Green — 终端荧光绿, 工程师工具感 */
html[data-theme="volt"] {
  --accent: #a3e635;
  --accent-hover: #b9ef58;
  --accent-soft: #a3e63518;
  --accent-border: #a3e63540;
  --accent-glow: #a3e63525;
  --border-focus: #a3e635;

  --mint: #22d3ee;
  --mint-soft: #22d3ee15;
  --mint-border: #22d3ee35;

  --warning: #facc15;
  --warning-soft: #facc1518;
  --danger: #f87171;
  --danger-soft: #f8717118;
  --info: #22d3ee;
  --info-soft: #22d3ee18;

  --text-on-accent: #0d1f04;

  --agent-1: #a3e635;
  --agent-2: #22d3ee;
  --agent-3: #f0abfc;
  --agent-4: #fde047;
  --agent-5: #4ade80;
  --agent-6: #93c5fd;
  --agent-7: #fb923c;
  --agent-8: #67e8f9;
}

/* Cyan Infra — 基础设施青蓝 */
html[data-theme="cyan"] {
  --accent: #22d3ee;
  --accent-hover: #4adef0;
  --accent-soft: #22d3ee18;
  --accent-border: #22d3ee40;
  --accent-glow: #22d3ee28;
  --border-focus: #22d3ee;

  --mint: #c4b5fd;
  --mint-soft: #c4b5fd15;
  --mint-border: #c4b5fd35;

  --warning: #fbbf24;
  --warning-soft: #fbbf2418;
  --danger: #f87171;
  --danger-soft: #f8717118;
  --info: #60a5fa;
  --info-soft: #60a5fa18;

  --text-on-accent: #04181d;

  --agent-1: #22d3ee;
  --agent-2: #c4b5fd;
  --agent-3: #f472b6;
  --agent-4: #34d399;
  --agent-5: #fbbf24;
  --agent-6: #60a5fa;
  --agent-7: #fb7185;
  --agent-8: #a78bfa;
}

/* Each theme also slightly tunes the canvas hue so it feels intentional */
html[data-theme="mint"] body, html[data-theme="mint"] {
  --bg-base: #0a1413;
  --bg-canvas: #0e1918;
  --bg-surface: #122220;
  --bg-elevated: #182d2a;
  --bg-input: #0d1817;
  --bg-hover: #1c322f;

  --border-subtle: #1a2a28;
  --border-default: #243532;
  --border-strong: #2f4441;
}
html[data-theme="volt"] body, html[data-theme="volt"] {
  --bg-base: #0a0f08;
  --bg-canvas: #0d130b;
  --bg-surface: #111a0e;
  --bg-elevated: #182213;
  --bg-input: #0d130b;
  --bg-hover: #1c2618;

  --border-subtle: #1a2316;
  --border-default: #25301f;
  --border-strong: #303d28;
}
html[data-theme="cyan"] body, html[data-theme="cyan"] {
  --bg-base: #08111a;
  --bg-canvas: #0b1622;
  --bg-surface: #0f1d2c;
  --bg-elevated: #142537;
  --bg-input: #0a1421;
  --bg-hover: #182c40;

  --border-subtle: #182838;
  --border-default: #233547;
  --border-strong: #2c4258;
}

/* Brand mark — gradient should follow accent */
html[data-theme="mint"] .brand-mark,
html[data-theme="mint"] .splash-logo { background: linear-gradient(135deg, #5eead4 0%, #2dd4bf 100%); box-shadow: 0 2px 10px rgba(94, 234, 212, 0.25); }
html[data-theme="volt"] .brand-mark,
html[data-theme="volt"] .splash-logo { background: linear-gradient(135deg, #a3e635 0%, #84cc16 100%); box-shadow: 0 2px 10px rgba(163, 230, 53, 0.3); }
html[data-theme="cyan"] .brand-mark,
html[data-theme="cyan"] .splash-logo { background: linear-gradient(135deg, #22d3ee 0%, #0891b2 100%); box-shadow: 0 2px 10px rgba(34, 211, 238, 0.3); }

/* Theme transitions */
html, body, .app, .sidebar, .main, .topbar, .page,
.section-card, .bind-card, .rec-tile, .rec-desk, .rec-pool,
.bind-canvas, .rec-dnd-stage, .channel-mini, .metric-card, .chart-card,
.list-row, .agent-pill, .activity-row, .company-card, .modal {
  transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
}
</style>
<style>
/* ============ Layout shell ============ */
.app {
  display: grid;
  grid-template-columns: 232px 1fr;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: var(--bg-base);
}

/* Sidebar */
.sidebar {
  background: var(--bg-canvas);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  padding: 18px 14px 16px;
  gap: 6px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 14px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 8px;
}
.brand-mark {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent) 0%, #b88858 100%);
  display: grid;
  place-items: center;
  color: var(--text-on-accent);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.04em;
  box-shadow: 0 2px 10px rgba(212, 165, 116, 0.25);
}
.brand-name {
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}
.brand-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 1px;
}

.company-context {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  margin: 4px 0 10px;
  border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);
  border: 1px solid var(--accent-border);
  position: relative;
}
.company-context-avatar {
  width: 30px; height: 30px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--agent-2), var(--agent-4));
  display: grid; place-items: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-on-accent);
  flex-shrink: 0;
}
.company-context-text { min-width: 0; flex: 1; }
.company-context-label {
  font-size: 10.5px;
  color: var(--text-tertiary);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.company-context-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.back-home {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 10px; margin-bottom: 8px;
  border-radius: var(--r-md);
  font-size: 12.5px;
  color: var(--text-secondary);
  border: 1px dashed var(--border-default);
}
.back-home:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--bg-hover); }

.nav-section {
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 10px;
  border-radius: var(--r-md);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  transition: background 0.1s ease, color 0.1s ease;
  position: relative;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  background: var(--bg-elevated);
  color: var(--text-primary);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -14px;
  top: 8px; bottom: 8px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: var(--accent);
}
.nav-item .icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
.nav-item.active .icon { opacity: 1; color: var(--accent); }
.nav-item .count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 8px 4px;
}
.user-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--mint), #6a9a8a);
  display: grid; place-items: center;
  font-size: 12px;
  color: var(--text-on-accent);
  font-weight: 600;
}
.user-name { font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-role { font-size: 10.5px; color: var(--text-tertiary); }
.cmd-trigger {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--text-tertiary);
  border: 1px solid var(--border-subtle);
}
.cmd-trigger:hover { color: var(--text-secondary); border-color: var(--border-default); }

/* Main */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.topbar {
  height: 48px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  background: var(--bg-base);
}
.breadcrumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px;
  color: var(--text-tertiary);
}
.breadcrumb-current { color: var(--text-primary); font-weight: 500; }
.topbar-spacer { flex: 1; }
.topbar-cmd {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 10px;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  font-size: 12.5px;
  color: var(--text-tertiary);
  width: 280px;
}
.topbar-cmd:hover { border-color: var(--border-strong); }
.topbar-cmd .placeholder { flex: 1; }
.topbar-icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 8px;
  color: var(--text-secondary);
  position: relative;
}
.topbar-icon-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.topbar-icon-btn .badge {
  position: absolute;
  top: 6px; right: 6px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.page {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-base);
}

/* Loading splash */
.splash {
  position: fixed; inset: 0;
  background: var(--bg-base);
  display: grid; place-items: center;
  z-index: 9999;
  transition: opacity 0.3s ease;
}
.splash.hidden { opacity: 0; pointer-events: none; }
.splash-logo {
  width: 56px; height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent) 0%, #b88858 100%);
  display: grid; place-items: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-on-accent);
  animation: pulse 1.4s ease-in-out infinite;
}

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(8, 12, 10, 0.7);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: grid;
  place-items: center;
  animation: overlayIn 0.15s ease-out;
}
.modal {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  width: 520px;
  max-width: calc(100vw - 48px);
  max-height: calc(100vh - 64px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: fadeIn 0.18s ease-out;
}
.modal-lg { width: 720px; }
.modal-xl { width: 920px; }
.modal-header {
  padding: 20px 24px 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-title { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.modal-sub { font-size: 12.5px; color: var(--text-tertiary); margin: 4px 0 0; }
.modal-close {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--text-tertiary);
}
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 24px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  border-top: 1px solid var(--border-subtle);
}

/* Command palette */
.cmd-palette {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  width: 600px;
  max-height: 480px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.cmd-search {
  height: 52px;
  border: none;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  padding: 0 20px;
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
}
.cmd-list { overflow-y: auto; padding: 6px; flex: 1; }
.cmd-group-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  padding: 10px 12px 6px;
}
.cmd-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13px;
}
.cmd-item.active { background: var(--accent-soft); color: var(--accent); }
.cmd-item .cmd-hint { margin-left: auto; font-size: 11px; color: var(--text-muted); }

/* Toast */
.toast-stack {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 200;
}
.toast {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  font-size: 13px;
  max-width: 360px;
  animation: fadeIn 0.2s ease-out;
}
.toast.success { border-left-color: var(--success); }
.toast.danger { border-left-color: var(--danger); }
.toast-title { font-weight: 600; margin-bottom: 2px; }
.toast-desc { color: var(--text-tertiary); font-size: 12px; }

/* ============ Page-specific styles ============ */

/* Overview */
.overview {
  padding: 28px 32px 48px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.metric-card {
  position: relative;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  padding: 20px 22px;
  overflow: hidden;
}
.metric-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 90% 0%, var(--accent-glow) 0%, transparent 50%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.metric-card:hover::before { opacity: 1; }
.metric-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.metric-card-label { font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.02em; }
.metric-card-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: grid; place-items: center;
  background: var(--bg-elevated);
  color: var(--text-secondary);
}
.metric-card-value {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}
.metric-card-delta {
  font-size: 11.5px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
  font-variant-numeric: tabular-nums;
}
.delta-up { color: var(--success); }
.delta-down { color: var(--danger); }

.row-2 {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
}
.chart-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); padding: 22px 24px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
.chart-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.chart-meta { font-size: 12px; color: var(--text-tertiary); }

.bar-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
.bar-row:last-child { border-bottom: none; }
.bar-label { width: 110px; font-size: 12.5px; color: var(--text-secondary); flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
.bar-track { flex: 1; height: 6px; background: var(--bg-input); border-radius: 3px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
.bar-value { width: 60px; text-align: right; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

.running-list { display: flex; flex-direction: column; gap: 1px; }
.running-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.running-row:last-child { border-bottom: none; }
.running-avatar { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--text-on-accent); flex-shrink: 0; }
.running-info { flex: 1; min-width: 0; }
.running-name { font-size: 13px; font-weight: 500; }
.running-host { font-size: 11.5px; color: var(--text-tertiary); margin-top: 1px; font-family: var(--font-mono); }

/* Sparkline */
.spark-wrap { padding: 14px 0; }
.spark-stat { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.spark-num { font-size: 32px; font-weight: 600; letter-spacing: -0.025em; }
.spark-meta { font-size: 12.5px; color: var(--text-tertiary); }

/* Companies */
.companies {
  padding: 28px 32px 48px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.search-input {
  flex: 1;
  max-width: 360px;
  height: 38px;
  padding: 0 14px 0 38px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%236c766f' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>");
  background-repeat: no-repeat;
  background-position: 14px center;
}
.search-input:focus { border-color: var(--border-focus); }
.toolbar-spacer { flex: 1; }
.filter-tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-md); }
.filter-tab { padding: 6px 12px; font-size: 12.5px; color: var(--text-secondary); border-radius: 6px; }
.filter-tab.active { background: var(--bg-elevated); color: var(--text-primary); }
.filter-tab:hover:not(.active) { color: var(--text-primary); }

.company-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.company-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.15s, transform 0.15s;
}
.company-card:hover { border-color: var(--border-strong); }
.company-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.2s;
}
.company-card:hover::before { opacity: 0.7; }
.company-card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.company-avatar {
  width: 44px; height: 44px;
  border-radius: 11px;
  display: grid; place-items: center;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-on-accent);
  letter-spacing: -0.02em;
}
.company-card-info { flex: 1; min-width: 0; }
.company-card-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  margin: 0 0 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.company-card-id { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
.company-card-stats {
  display: flex;
  gap: 22px;
  padding: 14px 0;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 14px;
}
.stat-item { display: flex; flex-direction: column; gap: 2px; }
.stat-num { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat-lbl { font-size: 11px; color: var(--text-tertiary); }
.company-card-actions { display: flex; gap: 6px; align-items: center; }

/* Provider page */
.split {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100%;
  min-height: 0;
}
.split-list {
  border-right: 1px solid var(--border-subtle);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.split-list-header {
  padding: 22px 20px 14px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg-base); z-index: 1;
}
.split-list-title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
.split-list-body { padding: 8px; flex: 1; }
.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  cursor: pointer;
  margin-bottom: 2px;
}
.list-row:hover { background: var(--bg-hover); }
.list-row.selected { background: var(--bg-elevated); }
.list-row.selected::before {
  content: ''; position: absolute; left: 0; width: 2px; top: 8px; bottom: 8px;
  background: var(--accent); border-radius: 0 2px 2px 0;
}
.list-row-avatar {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 14px;
  font-weight: 600;
}
.list-row-info { flex: 1; min-width: 0; }
.list-row-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row-meta { font-size: 11.5px; color: var(--text-tertiary); margin-top: 1px; display: flex; align-items: center; gap: 6px; }
.split-list-add {
  margin: 8px;
  padding: 10px;
  border: 1px dashed var(--border-default);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 12.5px;
  color: var(--text-tertiary);
}
.split-list-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.split-detail {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.detail-header {
  padding: 24px 32px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 18px;
}
.detail-avatar-lg {
  width: 52px; height: 52px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-size: 22px;
  font-weight: 600;
  flex-shrink: 0;
}
.detail-title { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.detail-sub { font-size: 12.5px; color: var(--text-tertiary); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.detail-actions { margin-left: auto; display: flex; gap: 6px; }

.detail-body { padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 32px; }

/* Form group */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.field-row {
  display: grid;
  grid-template-columns: minmax(140px, 180px) 1fr;
  gap: 24px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-subtle);
}
@container section (max-width: 560px) {
  .field-row { grid-template-columns: 1fr; gap: 6px; }
}
.field-row:last-child { border-bottom: none; }
.field-label-cell { padding-top: 8px; }
.field-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.field-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }
.field-value-cell { display: flex; flex-direction: column; gap: 6px; }

.read-value { font-size: 13.5px; color: var(--text-primary); padding: 8px 0; }
.read-value.mono { font-family: var(--font-mono); font-size: 12.5px; }

/* Table */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tbl thead th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-default);
  background: var(--bg-canvas);
}
.tbl tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
}
.tbl tbody tr:hover { background: var(--bg-canvas); }
.tbl tbody tr:last-child td { border-bottom: none; }

/* Toggle */
.toggle {
  position: relative;
  width: 32px; height: 18px;
  background: var(--border-default);
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.toggle::after {
  content: ''; position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--text-secondary);
  transition: transform 0.15s, background 0.15s;
}
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(14px); background: var(--text-on-accent); }

/* Segmented */
.seg {
  display: inline-flex;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  padding: 3px;
  gap: 2px;
}
.seg-item {
  padding: 6px 14px;
  font-size: 12.5px;
  border-radius: 6px;
  color: var(--text-secondary);
  cursor: pointer;
}
.seg-item.active { background: var(--bg-elevated); color: var(--text-primary); box-shadow: var(--shadow-sm); }

/* Agents */
.agents-page { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.agent-strip {
  padding: 18px 32px 14px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  flex-shrink: 0;
  background: var(--bg-canvas);
}
.agent-pill {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 12px 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  min-width: 84px;
}
.agent-pill:hover { background: var(--bg-hover); }
.agent-pill.selected { background: var(--bg-elevated); box-shadow: 0 0 0 1px var(--accent-border); }
.agent-pill-avatar {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-size: 22px;
  flex-shrink: 0;
  position: relative;
}
.agent-pill.leader .agent-pill-avatar { width: 52px; height: 52px; font-size: 26px; box-shadow: 0 0 0 2px var(--accent); }
.agent-pill.leader .agent-pill-avatar::after {
  content: '★';
  position: absolute;
  bottom: -4px; right: -4px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--text-on-accent);
  font-size: 10px;
  display: grid; place-items: center;
  font-weight: 700;
}
.agent-pill-name {
  font-size: 11.5px;
  color: var(--text-secondary);
  max-width: 76px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}
.agent-pill.selected .agent-pill-name { color: var(--text-primary); font-weight: 500; }
.agent-pill-add {
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 1px dashed var(--border-default);
  display: grid; place-items: center;
  color: var(--text-tertiary);
}
.agent-pill-add:hover { border-color: var(--accent); color: var(--accent); }

.agent-toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 32px;
  border-bottom: 1px solid var(--border-subtle);
}
.agent-toolbar-name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.unsaved-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 8px; vertical-align: middle; }

.agent-detail { flex: 1; overflow-y: auto; padding: 22px 32px 56px; display: flex; flex-direction: column; gap: 18px; }

.section-card {
  flex-shrink: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  overflow: hidden;
  container-type: inline-size;
  container-name: section;
}
.section-card-head {
  padding: 14px 22px 12px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.section-card-title { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.section-card-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.section-card-body { padding: 18px 22px; }
.section-card-body.is-tight { padding: 12px 22px; }
.section-card-body.is-flush { padding: 0; }

/* Tools grid */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  align-content: start;
  gap: 8px;
}
.tool-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-input);
  cursor: pointer;
}
.tool-chip:hover { border-color: var(--border-default); }
.tool-chip.on { border-color: var(--accent-border); background: var(--accent-soft); }
.tool-chip-icon {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--bg-elevated);
  display: grid; place-items: center;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.tool-chip.on .tool-chip-icon { background: var(--accent); color: var(--text-on-accent); }
.tool-chip-name { font-size: 12.5px; flex: 1; }

/* Skill cards */
.skill-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; align-items: stretch; }
.skill-card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
  padding: 12px 14px;
  background: var(--bg-input);
  display: flex; flex-direction: column; gap: 4px;
}
.skill-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.skill-desc { font-size: 11.5px; color: var(--text-tertiary); }
.skill-add {
  border: 1px dashed var(--border-default);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary);
  min-height: 70px;
  cursor: pointer;
}
.skill-add:hover { border-color: var(--accent); color: var(--accent); }

/* Guardrail panes */
.rail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.rail-pane {
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
  overflow: hidden;
}
.rail-head { padding: 12px 16px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-subtle); }
.rail-head.allow { background: var(--success-soft); color: var(--success); }
.rail-head.deny { background: var(--danger-soft); color: var(--danger); }
.rail-body { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.rail-body:empty::before { content: "暂无"; color: var(--text-muted); font-size: 12px; padding: 4px 2px; }
.rail-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 8px 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
}
.rail-tag.allow { background: var(--success-soft); border-color: var(--success); color: var(--success); }
.rail-tag.deny { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

/* Tabs (persona docs) */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 24px;
}
.tab {
  padding: 12px 14px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-tertiary);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
  letter-spacing: 0.04em;
  font-family: var(--font-mono);
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover:not(.active) { color: var(--text-primary); }

.editor {
  background: #0a100d;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.7;
  padding: 18px 24px;
  white-space: pre-wrap;
  color: #b5beb8;
}
.editor .h1 { color: var(--accent); font-weight: 600; }
.editor .h2 { color: var(--mint); font-weight: 600; }
.editor .keyword { color: #c9b08c; }
.editor .str { color: #9bb89a; }
.editor .comment { color: var(--text-muted); font-style: italic; }

/* Office detail */
.health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.health-card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
  padding: 14px 16px;
  background: var(--bg-input);
}
.health-row { display: flex; justify-content: space-between; align-items: center; }
.health-name { font-size: 13px; font-weight: 500; }
.health-version { font-size: 11.5px; color: var(--text-tertiary); font-family: var(--font-mono); margin-top: 4px; }

/* Timeline */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ''; position: absolute; top: 6px; bottom: 6px; left: 5px; width: 1px; background: var(--border-default); }
.timeline-item { position: relative; padding-bottom: 18px; }
.timeline-item::before {
  content: '';
  position: absolute;
  left: -21px; top: 4px;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--bg-base);
  border: 2px solid var(--accent);
}
.timeline-item.done::before { border-color: var(--success); }
.timeline-item.cancelled::before { border-color: var(--text-muted); background: var(--bg-base); }
.timeline-time { font-size: 11.5px; color: var(--text-tertiary); font-family: var(--font-mono); }
.timeline-title { font-size: 13px; margin: 2px 0 4px; font-weight: 500; }
.timeline-desc { font-size: 12px; color: var(--text-tertiary); }

/* Terminal */
.terminal {
  background: #070c09;
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 14px 18px;
  height: 280px;
  overflow-y: auto;
  line-height: 1.65;
  color: #a8b8ad;
}
.terminal .term-time { color: var(--text-muted); }
.terminal .term-info { color: var(--info); }
.terminal .term-ok { color: var(--success); }
.terminal .term-warn { color: var(--warning); }
.terminal .term-err { color: var(--danger); }
.cursor-blink { display: inline-block; width: 7px; height: 14px; background: var(--accent); animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
@keyframes blink { 50% { opacity: 0; } }

/* Step indicator */
.steps { display: flex; align-items: center; gap: 0; margin-bottom: 16px; }
.step {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  position: relative;
}
.step::after {
  content: ''; position: absolute;
  top: 14px; left: 50%; right: -50%;
  height: 1px; background: var(--border-default);
  z-index: 0;
}
.step:last-child::after { display: none; }
.step-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  display: grid; place-items: center;
  font-size: 12px;
  z-index: 1;
  position: relative;
}
.step.done .step-circle { background: var(--success); border-color: var(--success); color: var(--text-on-accent); }
.step.active .step-circle { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
.step.active .step-circle::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); border-top-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.step-label { font-size: 11.5px; color: var(--text-tertiary); }
.step.done .step-label, .step.active .step-label { color: var(--text-primary); }

/* ============ DEPLOY · BLOCK VIEW ============ */
.dpv { padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 22px; }

/* --- Hero: company chip + status --- */
.dpv-hero {
  display: grid;
  grid-template-columns: minmax(280px, 380px) 1fr;
  gap: 20px;
  align-items: stretch;
}
.dpv-hero-left, .dpv-hero-right {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 14px;
  display: flex; align-items: center;
}
.dpv-company-chip {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 8px 12px 8px 8px;
  border-radius: 10px;
  background: var(--bg-canvas);
  border: 1.5px dashed var(--accent-border);
  cursor: grab;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  user-select: none;
}
.dpv-company-chip:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 6px 20px -10px var(--accent-glow); }
.dpv-company-chip:active { cursor: grabbing; transform: scale(0.98); }
.dpv-company-avatar {
  width: 44px; height: 44px;
  border-radius: 11px;
  display: grid; place-items: center;
  font-size: 22px; line-height: 1;
  flex-shrink: 0;
  box-shadow: 0 4px 12px -4px rgba(0,0,0,0.3);
}
.dpv-company-info { flex: 1; min-width: 0; }
.dpv-company-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.dpv-company-meta { font-size: 11px; color: var(--text-tertiary); display: flex; gap: 6px; align-items: center; margin-top: 3px; }
.dpv-drag-hint {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--text-muted); font-size: 10px;
  padding: 4px 6px;
  border-left: 1px dashed var(--border-default);
}

.dpv-status { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dpv-status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
.dpv-status-line b { color: var(--text-primary); font-weight: 600; }
.dpv-status-dot { width: 8px; height: 8px; border-radius: 50%; }
.dpv-status-dot.live { background: var(--success); box-shadow: 0 0 0 3px color-mix(in oklch, var(--success) 25%, transparent); animation: dpvPulse 2s ease-in-out infinite; }
.dpv-status-dot.idle { background: var(--border-default); }
@keyframes dpvPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.dpv-status-actions { display: flex; gap: 6px; }
.dpv-status-hint { font-size: 11.5px; color: var(--text-muted); font-style: italic; }
.dpv-status.nowhere { flex-direction: column; align-items: flex-start; gap: 4px; }

/* --- Street: ground + buildings row --- */
.dpv-street {
  position: relative;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 36px 24px 28px;
  overflow: hidden;
  min-height: 360px;
}
.dpv-street.is-dragging { background: color-mix(in oklch, var(--accent-soft) 50%, var(--bg-surface)); }
.dpv-street-sky {
  position: absolute; top: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(180deg, color-mix(in oklch, var(--accent) 4%, transparent) 0%, transparent 100%);
  pointer-events: none;
}
.dpv-street-ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
  background: linear-gradient(180deg, var(--bg-canvas) 0%, color-mix(in oklch, #000 8%, var(--bg-canvas)) 100%);
  border-top: 2px dashed var(--border-subtle);
}

.dpv-buildings-row {
  position: relative;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  align-items: end;
}

/* --- Building --- */
.dpv-bldg {
  position: relative;
  display: flex; flex-direction: column;
  align-items: stretch;
  cursor: pointer;
  transition: transform 0.18s ease, filter 0.18s ease;
  padding-bottom: 64px; /* room for sign + badge */
}
.dpv-bldg:hover { transform: translateY(-2px); }
.dpv-bldg.is-offline { filter: grayscale(0.7) opacity(0.55); cursor: not-allowed; }
.dpv-bldg.is-occupied { cursor: not-allowed; }
.dpv-bldg.is-droppable { animation: dpvBldgBeacon 1.4s ease-in-out infinite; }
.dpv-bldg.is-droppable.is-occupied, .dpv-bldg.is-droppable.is-offline { animation: none; }
.dpv-bldg.is-hover { transform: translateY(-6px) scale(1.04); z-index: 5; }
.dpv-bldg.is-hover-blocked { transform: translateX(-2px); animation: dpvShake 0.4s ease-in-out; }
.dpv-bldg.is-just-done { animation: dpvBldgPop 0.5s cubic-bezier(0.2,1.4,0.4,1); }
.dpv-bldg.is-picked {
  transform: translateY(-4px);
  filter: drop-shadow(0 0 16px var(--accent-glow));
  z-index: 6;
}
.dpv-bldg.is-picked .dpv-bldg-roof,
.dpv-bldg.is-picked .dpv-bldg-body,
.dpv-bldg.is-picked .dpv-bldg-door {
  border-color: var(--accent);
}

/* --- Action callout above a picked building --- */
.dpv-bldg-action {
  position: absolute;
  top: -84px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 12px 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--accent-border);
  border-radius: 12px;
  box-shadow: 0 12px 32px -10px rgba(0,0,0,0.4), 0 0 0 4px color-mix(in oklch, var(--accent) 10%, transparent);
  z-index: 12;
  animation: dpvActionPop 0.22s cubic-bezier(0.2, 1.4, 0.4, 1);
  cursor: default;
}
.dpv-bldg-action::after {
  content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  border: 7px solid transparent; border-top-color: var(--bg-elevated);
  filter: drop-shadow(0 1px 0 var(--accent-border));
}
@keyframes dpvActionPop {
  from { opacity: 0; transform: translateX(-50%) translateY(6px) scale(0.95); }
  to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
.dpv-bldg-action-arrow {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px;
}
.dpv-bldg-action-emoji {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 13px;
  flex-shrink: 0;
}
.dpv-bldg-action-arrowline { color: var(--accent); display: flex; align-items: center; }
.dpv-bldg-action-target { font-size: 16px; }
.dpv-bldg-action-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  font-size: 13px; font-weight: 600;
  white-space: nowrap;
}
.dpv-bldg-action-cancel {
  background: none; border: none;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  padding: 2px 8px;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
}
.dpv-bldg-action-cancel:hover { color: var(--text-secondary); }

@keyframes dpvBldgBeacon {
  0%, 100% { filter: drop-shadow(0 0 0 transparent); }
  50% { filter: drop-shadow(0 0 12px var(--accent-glow)); }
}
@keyframes dpvShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes dpvBldgPop { 0% { transform: scale(1); } 50% { transform: scale(1.06) translateY(-4px); } 100% { transform: scale(1); } }

.dpv-bldg-roof {
  position: relative;
  height: 12px;
  margin: 0 8px;
  background: linear-gradient(180deg, var(--border-strong) 0%, var(--border-default) 100%);
  border-radius: 4px 4px 0 0;
}
.dpv-bldg-roof::before, .dpv-bldg-roof::after {
  content: ''; position: absolute; top: 0; bottom: 0;
}
.dpv-bldg-roof::before { left: -8px; right: 50%; background: linear-gradient(135deg, transparent 50%, var(--border-default) 50%); }
.dpv-bldg-roof::after { right: -8px; left: 50%; background: linear-gradient(225deg, transparent 50%, var(--border-default) 50%); }
.dpv-bldg-flag {
  position: absolute;
  top: -16px; left: 50%; transform: translateX(-50%);
  width: 22px; height: 22px;
  border-radius: 6px;
  display: grid; place-items: center;
  z-index: 3;
  box-shadow: 0 2px 8px -2px rgba(0,0,0,0.4);
  animation: dpvFlagWave 2.5s ease-in-out infinite;
}
.dpv-bldg-flag::before {
  content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  width: 1.5px; height: 12px; background: var(--border-default);
}
.dpv-bldg-flag.muted { opacity: 0.5; animation: none; }
@keyframes dpvFlagWave { 0%, 100% { transform: translateX(-50%) rotate(-3deg); } 50% { transform: translateX(-50%) rotate(3deg); } }

.dpv-bldg-body {
  display: flex; flex-direction: column-reverse;
  gap: 3px;
  padding: 6px;
  background: var(--bg-canvas);
  border: 1px solid var(--border-subtle);
  border-bottom: none;
}
.dpv-bldg.is-offline .dpv-bldg-body { background: color-mix(in oklch, var(--border-subtle) 30%, var(--bg-canvas)); }

.dpv-bldg-floor {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  padding: 5px 4px;
  background: var(--bg-input);
  border-radius: 2px;
  border: 1px solid var(--border-subtle);
}
.dpv-bldg-window {
  height: 9px;
  border-radius: 1.5px;
  background: var(--border-default);
  opacity: 0.6;
  transition: background 0.3s, box-shadow 0.3s, opacity 0.3s;
}
.dpv-bldg-floor.lit .dpv-bldg-window {
  background: var(--accent);
  opacity: 0.95;
  box-shadow: 0 0 4px var(--accent-glow), inset 0 0 2px color-mix(in oklch, #fff 30%, var(--accent));
}
.dpv-bldg-floor.lit .dpv-bldg-window:nth-child(2) { animation: dpvFlicker 4s ease-in-out infinite; }
.dpv-bldg-floor.lit .dpv-bldg-window:nth-child(3) { animation: dpvFlicker 5.2s ease-in-out infinite 1.4s; }
.dpv-bldg-floor.other-tenant.lit .dpv-bldg-window {
  background: var(--border-strong);
  box-shadow: none;
  opacity: 0.7;
}
.dpv-bldg-floor.current-step {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 12px var(--accent-glow);
  animation: dpvFloorActivate 0.6s ease;
}
@keyframes dpvFloorActivate {
  0% { transform: scale(0.96); opacity: 0.4; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes dpvFlicker {
  0%, 92%, 100% { opacity: 0.95; }
  93% { opacity: 0.4; }
  94% { opacity: 0.95; }
  96% { opacity: 0.5; }
}

.dpv-bldg-door {
  height: 24px;
  margin: 0 8px;
  background: var(--border-strong);
  border-radius: 0 0 4px 4px;
  display: grid; place-items: center;
  border: 1px solid var(--border-subtle);
  border-top: none;
}
.dpv-bldg-receptionist { font-size: 16px; line-height: 1; }

.dpv-bldg-sign {
  position: absolute;
  bottom: 28px; left: 50%; transform: translateX(-50%);
  width: 100%;
  text-align: center;
}
.dpv-bldg-name { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dpv-bldg-host { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

.dpv-bldg-badge {
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%;
  display: flex; justify-content: center;
}
.b-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 500;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.b-tag.vacant { background: color-mix(in oklch, var(--success) 15%, transparent); color: var(--success); border: 1px solid color-mix(in oklch, var(--success) 30%, transparent); }
.b-tag.home { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
.b-tag.busy { background: var(--bg-elevated); color: var(--text-tertiary); border: 1px solid var(--border-subtle); }
.b-tag.offline { background: color-mix(in oklch, var(--warning) 15%, transparent); color: var(--warning); border: 1px solid color-mix(in oklch, var(--warning) 30%, transparent); }

/* Hover-while-dragging preview */
.dpv-bldg-preview {
  position: absolute;
  top: -42px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 10px;
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  box-shadow: 0 8px 24px -6px var(--accent-glow);
  z-index: 10;
  pointer-events: none;
  animation: dpvPreviewPop 0.2s ease-out;
}
.dpv-bldg-preview::after {
  content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: var(--accent);
}
.dpv-bldg-preview.blocked { background: var(--warning); box-shadow: 0 8px 24px -6px color-mix(in oklch, var(--warning) 40%, transparent); }
.dpv-bldg-preview.blocked::after { border-top-color: var(--warning); }
.dpv-bldg-preview-emoji { font-size: 18px; line-height: 1; }
.dpv-bldg-preview-msg { font-size: 10.5px; font-weight: 600; white-space: nowrap; }
@keyframes dpvPreviewPop { from { transform: translateX(-50%) translateY(4px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

.dpv-bldg-step-caption {
  position: absolute;
  top: -28px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--accent-border);
  border-radius: 999px;
  font-size: 10.5px; font-weight: 500; color: var(--accent);
  white-space: nowrap;
  z-index: 4;
}
.dpv-bldg-done-banner {
  position: absolute;
  top: -32px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 5px;
  padding: 5px 12px;
  background: var(--success);
  color: #fff;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
  z-index: 4;
  animation: dpvDoneBanner 4s ease-out forwards;
}
@keyframes dpvDoneBanner {
  0% { transform: translateX(-50%) translateY(8px); opacity: 0; }
  10%, 80% { transform: translateX(-50%) translateY(0); opacity: 1; }
  100% { transform: translateX(-50%) translateY(-4px); opacity: 0; }
}

/* --- Log panel --- */
.dpv-log {
  background: var(--bg-canvas);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  overflow: hidden;
}
.dpv-log-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--text-secondary);
}
.dpv-log-body {
  padding: 14px 18px;
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--text-secondary);
  white-space: pre-wrap;
  max-height: 220px;
  overflow-y: auto;
}

/* --- History --- */
.dpv-history {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 18px 20px;
}
.dpv-history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.dpv-history-list { display: flex; flex-direction: column; }
.dpv-history-row {
  display: grid;
  grid-template-columns: 80px 1fr 2fr 80px 70px;
  gap: 12px;
  align-items: center;
  padding: 9px 4px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 12px;
}
.dpv-history-row:last-child { border-bottom: none; }
.dpv-history-time { color: var(--text-muted); font-size: 11px; }
.dpv-history-co { color: var(--text-primary); font-weight: 500; }
.dpv-history-arrow { display: flex; align-items: center; color: var(--text-secondary); font-size: 11.5px; }
.dpv-history-who { font-size: 11px; }
.dpv-history-status { font-size: 11px; font-weight: 500; text-align: right; }
.dpv-history-status.ok { color: var(--success); }
.dpv-history-status.warn { color: var(--warning); }
.dpv-history-status.undo { color: var(--text-muted); }

.channel-mini {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 12px 6px 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
}

/* Agent relationship graph */
.agent-graph-wrap {
  padding: 24px 32px 40px;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}
.agent-graph-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.agent-graph-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.agent-graph-sub {
  font-size: 12.5px;
  color: var(--text-tertiary);
  margin: 4px 0 0;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.agent-graph-sub b { font-weight: 500; }
.agent-graph-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}

.agent-graph-canvas {
  flex: 1;
  min-height: 520px;
  position: relative;
  background:
    radial-gradient(circle at 50% 50%, var(--bg-canvas) 0%, var(--bg-base) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  overflow: hidden;
}

</style>
</head>
